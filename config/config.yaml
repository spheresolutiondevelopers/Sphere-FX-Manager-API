# ─── Risk Limits ──────────────────────────────────────────────
risk_limits:
  max_lot: 100.0
  min_lot: 0.01
  max_daily_drawdown_percent: 5.0
  min_rr_ratio: 1.5
  max_positions: 10

# ─── Backtester ────────────────────────────────────────────────
backtester:
  default_rr: 2.0
  default_spread_pips: 1.5
  default_commission: 3.5
  min_data_points: 100

# ─── Queue ──────────────────────────────────────────────────────
queue:
  poll_interval_seconds: 2
  max_claim_attempts: 3

# ─── DB Pool ──────────────────────────────────────────────────
pool:
  async_pool_size: 5
  async_max_overflow: 5
  sync_pool_size: 2

# ─── Logging ──────────────────────────────────────────────────
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# ─── Extractor ────────────────────────────────────────────────
extractor:
  grpc_port: 50051
  patterns_dir: /app/config/patterns
  log_level: info

# ─── Live Worker ──────────────────────────────────────────────
live_worker:
  poll_interval_seconds: 2
  max_claim_attempts: 3
  mt5_bridge_url: http://windows-vps:8081
  mt5_timeout_seconds: 10
  max_open_conns: 5
  max_idle_conns: 2
  conn_max_lifetime_minutes: 30
  log_level: info